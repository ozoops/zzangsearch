# Example secrets configuration
password = "your_password"

[gdrive_service_account]
# Google service account JSON fields
type = "service_account"
project_id = "your_project_id"
private_key_id = "your_key_id"
private_key = "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n"
client_email = "service-account@project.iam.gserviceaccount.com"
client_id = "your_client_id"
# Alternatively, you can omit the block above and set:
# gdrive_service_account_file = ".streamlit/gdrive_service_account.json"
# gdrive_service_account_json = "{...json string...}"

[gsheets]
# Either sheet_url or sheet_id can be provided
sheet_url = "https://docs.google.com/spreadsheets/d/..."
worksheet = "Sheet1"

[drive_excel]
# Optional: Download an Excel file stored on Google Drive by ID or share URL
file_id = "1AbCdEfGhIjklMNopQR"
# file_url = "https://drive.google.com/file/d/1AbCdEfGhIjklMNopQR/view"
# worksheet = "Sheet1"
